            const [myStream, setMyStream] = useState(null);
            const [connectionStatus, setConnectionStatus] = useState('');
            const [peerReady, setPeerReady] = useState(false);
            
            const peerRef = useRef(null);
            const connectionsRef = useRef({});
            const callsRef = useRef({});
            const videoRefs = useRef({});
            const audioContexts = useRef({});
            const analyzerNodes = useRef({});
            const startTimeRef = useRef(null);
            const myVideoRef = useRef(null);
            const myPeerIdRef = useRef(null);

            const startAsHost = async () => {
                const hostName = prompt("Enter your name (Host):");
                if (!hostName || !hostName.trim()) return;

                setConnectionStatus('Getting camera access...');
                setParticipantName(hostName);
                
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: true, 
                        audio: true 
                    });
                    setMyStream(stream);
                    
                    if (myVideoRef.current) {
                        myVideoRef.current.srcObject = stream;
                    }
                    
                    setConnectionStatus('Creating room...');
                    
                    const peer = new Peer({
                        config: {
                            iceServers: [
                                { urls: 'stun:stun.l.google.com:19302' },
                                { urls: 'stun:stun1.l.google.com:19302' },
                                { urls: 'stun:stun2.l.google.com:19302' }
                            ]
                        },
                        debug: 2
                    });
                    
                    peerRef.current = peer;

                    peer.on('open', (id) => {
                        console.log('Host Peer ID:', id);
                        myPeerIdRef.current = id;
                        setRoomCode(id);
                        setPeerReady(true);
                        setMode('host');
                        setConnectionStatus('Room ready!');
                        
                        setParticipants([{
                            id: 'host',
                            peerId: id,
                            name: hostName,
                            stream: stream,
                            speaking: false,
                            speakingTime: 0,
                            contributions: 0,
                            sentimentScore: 0,
                            audioLevel: 0,
                            isHost: true
                        }]);
                    });

                    peer.on('connection', (conn) => {
                        console.log('New data connection from:', conn.peer);
                        connectionsRef.current[conn.peer] = conn;

                        conn.on('open', () => {
                            console.log('Data channel open with:', conn.peer);
                        });

                        conn.on('data', (data) => {
                            console.log('Received data:', data);
                            handleDataFromParticipant(data, conn.peer);
                        });

                        conn.on('error', (err) => {
                            console.error('Connection error with', conn.peer, err);
                        });
                    });

                    peer.on('call', (call) => {
                        console.log('Receiving call from:', call.peer);
                        
                        call.answer(stream);
                        callsRef.current[call.peer] = call;
                        
                        call.on('stream', (remoteStream) => {
                            console.log('Received stream from:', call.peer);
                            
                            setParticipants(prev => prev.map(p => 
                                p.peerId === call.peer ? { ...p, stream: remoteStream } : p
                            ));
                            
                            setTimeout(() => {
                                if (videoRefs.current[call.peer]) {
                                    videoRefs.current[call.peer].srcObject = remoteStream;
                                }
                                setupAudioAnalysis(call.peer, remoteStream);
                            }, 100);
                        });

                        call.on('error', (err) => {
                            console.error('Call error with', call.peer, err);
                        });
                    });

                    peer.on('error', (err) => {
                        console.error('Peer error:', err);
                        setConnectionStatus('Error: ' + err.type + ' - ' + err.message);
                        
                        if (err.type === 'peer-unavailable') {
                            console.log('Peer unavailable - this is normal for host');
                        }
                    });

                    peer.on('disconnected', () => {
                        console.log('Peer disconnected, attempting reconnect...');
                        peer.reconnect();
                    });

                } catch (err) {
                    alert('Error: ' + err.message);
                    setMode(null);
                    setConnectionStatus('');
                }
            };

            const joinAsParticipant = async () => {
                if (!participantName.trim() || !joinCode.trim()) {
                    alert('Please enter your name and room code');
                    return;
                }

                setConnectionStatus('Getting camera access...');
                
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: true, 
                        audio: true 
                    });
                    setMyStream(stream);
                    
                    if (myVideoRef.current) {
                        myVideoRef.current.srcObject = stream;
                    }

                    setConnectionStatus('Connecting to host...');
                    
                    const peer = new Peer({
                        config: {
                            iceServers: [
                                { urls: 'stun:stun.l.google.com:19302' },
                                { urls: 'stun:stun1.l.google.com:19302' },
                                { urls: 'stun:stun2.l.google.com:19302' }
                            ]
                        },
                        debug: 2
                    });
                    
                    peerRef.current = peer;

                    peer.on('open', (myId) => {
                        console.log('My Peer ID:', myId);
                        myPeerIdRef.current = myId;
                        setPeerReady(true);
                        
                        const hostId = joinCode.trim();
                        console.log('Attempting to connect to host:', hostId);
                        
                        setTimeout(() => {
                            try {
                                const conn = peer.connect(hostId, {
                                    reliable: true
                                });
                                
                                connectionsRef.current['host'] = conn;

                                conn.on('open', () => {
                                    console.log('Connected to host!');
                                    setConnectionStatus('Connected! Sending video...');
                                    setMode('participant');
                                    setRoomCode(joinCode);
                                    setConnected(true);
                                    
                                    conn.send({
                                        type: 'join',
                                        name: participantName,
                                        peerId: myId
                                    });
                                    
                                    console.log('Calling host with video...');
                                    const call = peer.call(hostId, stream);
                                    callsRef.current['host'] = call;
                                    
                                    call.on('stream', (hostStream) => {
                                        console.log('Receiving host stream');
                                    });

                                    call.on('error', (err) => {
                                        console.error('Call error:', err);
                                    });
                                });

                                conn.on('data', (data) => {
                                    console.log('Received from host:', data);
                                    handleDataFromHost(data);
                                });

                                conn.on('error', (err) => {
                                    console.error('Connection error:', err);
                                    setConnectionStatus('Connection failed: ' + err.type);
                                });

                                conn.on('close', () => {
                                    console.log('Connection closed');
                                    setConnectionStatus('Connection closed by host');
                                });

                            } catch (err) {
                                console.error('Failed to connect:', err);
                                setConnectionStatus('Could not connect to host. Please check the Peer ID.');
                            }
                        }, 500);
                    });

                    peer.on('error', (err) => {
                        console.error('Peer error:', err);
                        if (err.type === 'peer-unavailable') {
                            setConnectionStatus('Host not found. Please check the Peer ID and ensure host is ready.');
                        } else {
                            setConnectionStatus('Error: ' + err.type);
                        }
                    });

                    peer.on('disconnected', () => {
                        console.log('Disconnected, trying to reconnect...');
                        peer.reconnect();
                    });

                    setTimeout(() => {
                        if (!connected && mode !== 'participant') {
                            setConnectionStatus('Connection timeout. Please check the Peer ID and try again.');
                        }
                    }, 15000);

                } catch (err) {
                    alert('Error: ' + err.message);
                    setConnectionStatus('');
                }
            };

            const handleDataFromParticipant = (data, peerId) => {
                if (data.type === 'join') {
                    console.log('Participant joined:', data.name);
                    
                    setParticipants(prev => {
                        if (prev.some(p => p.peerId === peerId)) return prev;
                        
                        const newParticipant = {
                            id: peerId,
                            peerId: peerId,
                            name: data.name,
                            stream: null,
                            speaking: false,
                            speakingTime: 0,
                            contributions: 0,
                            sentimentScore: 0,
                            audioLevel: 0,
                            isHost: false
                        };
                        
                        return [...prev, newParticipant];
                    });
                }
            };

            const handleDataFromHost = (data) => {
                if (data.type === 'gd-start') {
                    setGdStarted(true);
                    alert('GD Started! Speak clearly and contribute meaningfully.');
                } else if (data.type === 'gd-end') {
                    setGdStarted(false);
                    alert('GD Ended! Check the host screen for your feedback.');
                }
            };

            const broadcastToAll = (data) => {
                Object.entries(connectionsRef.current).forEach(([peerId, conn]) => {
                    if (conn && conn.open) {
                        try {
                            conn.send(data);
                        } catch (err) {
                            console.error('Error sending to', peerId, err);
                        }
                    }
                });
            };

            const setupAudioAnalysis = (peerId, stream) => {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const audioSource = audioContext.createMediaStreamSource(stream);
                    const analyzer = audioContext.createAnalyser();
                    analyzer.fftSize = 256;
                    audioSource.connect(analyzer);
                    
                    audioContexts.current[peerId] = audioContext;
                    analyzerNodes.current[peerId] = analyzer;
                    
                    const monitorAudio = () => {
                        if (!gdStarted || gdEnded) return;
                        
                        const dataArray = new Uint8Array(analyzer.frequencyBinCount);
                        analyzer.getByteFrequencyData(dataArray);
                        const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                        
                        const isSpeaking = average > 30;
                        
                        setParticipants(prev => prev.map(p => {
                            if (p.peerId === peerId) {
                                const wasNotSpeaking = !p.speaking;
                                const nowSpeaking = isSpeaking;
                                const newContributions = wasNotSpeaking && nowSpeaking ? p.contributions + 1 : p.contributions;
                                
                                return {
                                    ...p,
                                    speaking: isSpeaking,
                                    contributions: newContributions,
                                    audioLevel: average
                                };
                            }
                            return p;
                        }));
                        
                        if (gdStarted && !gdEnded) {
                            requestAnimationFrame(monitorAudio);
                        }
                    };
                    
                    if (gdStarted) monitorAudio();
                } catch (err) {
                    console.error('Audio analysis error:', err);
                }
            };

            const startGD = () => {
                if (participants.length <= 1) {
                    alert('Need at least 2 participants (including host)!');
                    return;
                }
                
                setGdStarted(true);
                startTimeRef.current = Date.now();
                
                broadcastToAll({ type: 'gd-start' });
                
                participants.forEach(p => {
                    if (p.stream && !p.isHost) {
                        setupAudioAnalysis(p.peerId, p.stream);
                    }
                });
            };

            const endGD = () => {
                setGdEnded(true);
                setGdStarted(false);
                
                broadcastToAll({ type: 'gd-end' });
                
                Object.values(audioContexts.current).forEach(ctx => {
                    try {
                        ctx.close();
                    } catch (err) {
                        console.error('Error closing audio context:', err);
                    }
                });
                
                runMLAnalysis();
            };

            const runMLAnalysis = () => {
                const nonHostParticipants = participants.filter(p => !p.isHost);
                
                const results = nonHostParticipants.map(participant => {
                    const speakingPercentage = totalTime > 0 ? (participant.speakingTime / totalTime) * 100 : 0;
                    const contributionsPerMinute = totalTime > 0 ? (participant.contributions / (totalTime / 60)) : 0;
                    
                    const participationScore = Math.min(100, speakingPercentage * 2);
                    const engagementScore = Math.min(100, contributionsPerMinute * 20);
                    const balanceScore = Math.min(100, 100 - Math.abs(speakingPercentage - (100 / nonHostParticipants.length)) * 2);
                    const sentimentScore = 75;
                    
                    const overallScore = (
                        participationScore * 0.35 + 
                        engagementScore * 0.25 + 
                        balanceScore * 0.20 + 
                        sentimentScore * 0.20
                    ).toFixed(1);
                    
                    let feedback = [];
                    
                    if (participationScore < 40) {
                        feedback.push('🔴 Low participation - try to speak more and share your ideas');
                    } else if (participationScore > 70) {
                        feedback.push('🟢 Excellent participation - you actively engaged in the discussion');
                    } else {
                        feedback.push('🟡 Good participation - maintain this level of engagement');
                    }
                    
                    if (engagementScore < 30) {
                        feedback.push('💡 Make more contributions - break down your points into smaller segments');
                    } else if (engagementScore > 60) {
                        feedback.push('⭐ Great engagement - you contributed frequently to the discussion');
                    }
                    
                    if (balanceScore < 40) {
                        if (speakingPercentage > (100 / nonHostParticipants.length)) {
                            feedback.push('⚖️ Allow others more speaking time - practice active listening');
                        } else {
                            feedback.push('⚖️ Speak up more - your voice is valuable to the discussion');
                        }
                    } else {
                        feedback.push('✅ Well-balanced participation - great teamwork');
                    }
                    
                    feedback.push('😊 Maintained constructive communication throughout');
                    
                    let grade;
                    if (overallScore >= 85) grade = 'A+';
                    else if (overallScore >= 75) grade = 'A';
                    else if (overallScore >= 65) grade = 'B+';
                    else if (overallScore >= 55) grade = 'B';
                    else if (overallScore >= 45) grade = 'C';
                    else grade = 'D';
                    
                    return {
                        name: participant.name,
                        speakingTime: participant.speakingTime,
                        speakingPercentage: speakingPercentage.toFixed(1),
                        contributions: participant.contributions,
                        contributionsPerMinute: contributionsPerMinute.toFixed(1),
                        overallScore,
                        participationScore: participationScore.toFixed(1),
                        engagementScore: engagementScore.toFixed(1),
                        balanceScore: balanceScore.toFixed(1),
                        sentimentScore: sentimentScore.toFixed(1),
                        feedback,
                        grade
                    };
                });
                
                const avgScore = results.length > 0 ? results.reduce((sum, r) => sum + parseFloat(r.overallScore), 0) / results.length : 0;
                
                setAnalysis({
                    participants: results,
                    groupInsights: {
                        totalTime,
                        avgScore: avgScore.toFixed(1),
                        totalContributions: results.reduce((sum, r) => sum + r.contributions, 0),
                        bestPerformer: results.length > 0 ? results.reduce((max, r) => 
                            parseFloat(r.overallScore) > parseFloat(max.overallScore) ? r : max
                        ) : { name: 'N/A' },
                        needsImprovement: results.length > 0 ? results.reduce((min, r) => 
                            parseFloat(r.overallScore) < parseFloat(min.overallScore) ? r : min
                        ) : { name: 'N/A' }
                    }
                });
            };

            const copyRoomCode = () => {
                const code = myPeerIdRef.current || roomCode;
                navigator.clipboard.writeText(code);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            useEffect(() => {
                let interval;
                if (gdStarted && !gdEnded) {
                    interval = setInterval(() => {
                        setTotalTime(Math.floor((Date.now() - startTimeRef.current) / 1000));
                        
                        setParticipants(prev => prev.map(p => {
                            if (p.speaking) {
                                return { ...p, speakingTime: p.speakingTime + 1 };
                            }
                            return p;
                        }));
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [gdStarted, gdEnded]);

            useEffect(() => {
                return () => {
                    if (peerRef.current) {
                        peerRef.current.destroy();
                    }
                    if (myStream) {
                        myStream.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            if (!mode) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50 flex items-center justify-center p-4">
                        <div className="max-w-4xl w-full">
                            <div className="text-center mb-12">
                                <div className="flex items-center justify-center mb-4">
                                    <div className="w-16 h-16 text-blue-600">
                                        <Brain />
                                    </div>
                                </div>
                                <h1 className="text-5xl font-bold text-gray-800 mb-2">Multi-Device GD Analyzer</h1>
                                <p className="text-gray-600 text-lg">Real-time Video • Multi-Device Support • AI Feedback</p>
                                {connectionStatus && (
                                    <div className="mt-4 p-3 bg-blue-50 border border-blue-200 rounded-lg">
                                        <p className="text-sm text-blue-700 font-semibold">{connectionStatus}</p>
                                    </div>
                                )}
                            </div>

                            <div className="grid md:grid-cols-2 gap-6">
                                <div className="bg-white rounded-2xl shadow-xl p-8 hover:shadow-2xl transition-shadow border-2 border-blue-200">
                                    <div className="text-center">
                                        <div className="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <Users />
                                        </div>
                                        <h2 className="text-2xl font-bold text-gray-800 mb-2">Host GD Session</h2>
                                        <p className="text-gray-600 mb-6">Create a room and invite participants</p>
                                        <button
                                            onClick={startAsHost}
                                            className="w-full px-6 py-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-bold text-lg hover:from-blue-700 hover:to-purple-700 transition-all transform hover:scale-105"
                                        >
                                            🎯 Create Room
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-xl p-8 hover:shadow-2xl transition-shadow border-2 border-green-200">
                                    <div className="text-center">
                                        <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <Video />
                                        </div>
                                        <h2 className="text-2xl font-bold text-gray-800 mb-2">Join as Participant</h2>
                                        <p className="text-gray-600 mb-4">Enter room code to join</p>
                                        <input
                                            type="text"
                                            placeholder="Your Name"
                                            value={participantName}
                                            onChange={(e) => setParticipantName(e.target.value)}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-green-500 focus:border-transparent"
                                        />
                                        <input
                                            type="text"
                                            placeholder="Paste Host's Peer ID"
                                            value={joinCode}
                                            onChange={(e) => setJoinCode(e.target.value)}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-green-500 focus:border-transparent font-mono text-sm"
                                        />
                                        <button
                                            onClick={joinAsParticipant}
                                            disabled={!participantName.trim() || !joinCode.trim()}
                                            className="w-full px-6 py-4 bg-gradient-to-r from-green-600 to-blue-600 text-white rounded-xl font-bold text-lg hover:from-green-700 hover:to-blue-700 transition-all transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                                        >
                                            🚀 Join Room
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-12 bg-yellow-50 border border-yellow-200 rounded-xl p-6">
                                <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                                    <AlertCircle />
                                    Important Instructions:
                                </h3>
                                <ul className="space-y-2 text-gray-700 text-sm">
                                    <li>✅ <strong>Host:</strong> Click "Create Room" - wait for the Peer ID to appear (takes 2-5 seconds)</li>
                                    <li>✅ <strong>Host:</strong> Copy the FULL Peer ID and share it with participants</li>
                                    <li>✅ <strong>Participants:</strong> Enter name, paste the full Peer ID, then click Join</li>
                                    <li>✅ <strong>Both:</strong> Allow camera/microphone access when prompted</li>
                                    <li>⚠️ Make sure both host and participants have stable internet connection</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                );
            }

            if (mode === 'participant') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-green-50 via-white to-blue-50 p-4">
                        <div className="max-w-2xl mx-auto">
                            <div className="text-center mb-6">
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">👤 Participant View</h1>
                                <p className="text-gray-600">Name: <span className="font-bold">{participantName}</span></p>
                                {connectionStatus && (
                                    <div className="mt-2 p-2 bg-blue-50 border border-blue-200 rounded-lg">
                                        <p className="text-sm text-blue-700">{connectionStatus}</p>
                                    </div>
                                )}
                            </div>

                            <div className="bg-white rounded-xl shadow-lg p-6">
                                <video
                                    ref={myVideoRef}
                                    autoPlay
                                    playsInline
                                    muted
                                    className="w-full rounded-lg bg-gray-900 mb-4"
                                    style={{ maxHeight: '400px' }}
                                />
                                
                                {connected ? (
                                    <div className="text-center space-y-3">
                                        <div className="flex items-center justify-center gap-2 text-green-600">
                                            <div className="w-3 h-3 bg-green-600 rounded-full animate-pulse" />
                                            <span className="font-semibold">Connected to GD Session</span>
                                        </div>
                                        {gdStarted ? (
                                            <div className="p-4 bg-red-50 border border-red-200 rounded-lg">
                                                <p className="text-red-700 font-bold">🔴 GD in Progress</p>
                                                <p className="text-sm text-red-600 mt-1">Speak clearly and contribute meaningfully!</p>
                                            </div>
                                        ) : (
                                            <p className="text-gray-600">Wait for host to start the discussion</p>
                                        )}
                                        <p className="text-sm text-gray-500">Your video and audio are being streamed to the host</p>
                                    </div>
                                ) : (
                                    <div className="text-center">
                                        <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto mb-3" />
                                        <p className="text-gray-600">Connecting to session...</p>
                                    </div>
                                )}
                            </div>

                            <div className="mt-6 bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-gray-700">
                                <p className="font-semibold mb-2">📝 Tips for a Great GD:</p>
                                <ul className="space-y-1">
                                    <li>• Speak clearly and at a moderate pace</li>
                                    <li>• Make eye contact with the camera</li>
                                    <li>• Listen actively to others</li>
                                    <li>• Contribute meaningfully to the discussion</li>
                                    <li>• Wait for your turn to speak</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50 p-4">
                    <div className="max-w-7xl mx-auto">
                        <div className="text-center mb-6">
                            <h1 className="text-4xl font-bold text-gray-800 mb-2">🎯 Host Dashboard</h1>
                            <p className="text-gray-600">Host: <span className="font-bold">{participantName}</span></p>
                        </div>

                        {!gdEnded && (
                            <>
                                {peerReady && (
                                    <div className="bg-gradient-to-r from-blue-500 to-purple-500 rounded-xl shadow-lg p-6 text-white mb-6">
                                        <div className="text-center">
                                            <h2 className="text-2xl font-bold mb-3">📱 Share This Peer ID with Participants</h2>
                                            <div className="bg-white/90 text-gray-800 px-4 py-3 rounded-xl text-sm font-mono break-all mb-3 max-w-2xl mx-auto">
                                                {myPeerIdRef.current || roomCode}
                                            </div>
                                            <button
                                                onClick={copyRoomCode}
                                                className="px-6 py-3 bg-white/20 hover:bg-white/30 rounded-xl transition-all inline-flex items-center gap-2"
                                            >
                                                {copied ? <Check /> : <Copy />}
                                                {copied ? 'Copied!' : 'Copy Peer ID'}
                                            </button>
                                            <p className="mt-3 text-sm opacity-90">Participants must paste this EXACT ID to join</p>
                                        </div>
                                    </div>
                                )}

                                <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-4">
                                        👥 Participants ({participants.length})
                                    </h2>
                                    
                                    {participants.length === 0 ? (
                                        <div className="text-center py-12">
                                            <div className="w-16 h-16 mx-auto mb-4 text-gray-300">
                                                <Users />
                                            </div>
                                            <p className="text-gray-500 text-lg">Waiting for participants...</p>
                                            <p className="text-gray-400 text-sm mt-2">Share the Peer ID above</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {participants.map(p => (
                                                <div key={p.peerId} className="border border-gray-200 rounded-lg p-4">
                                                    <h3 className="font-bold text-lg text-gray-800 mb-2">
                                                        {p.name} {p.isHost && '👑'}
                                                    </h3>
                                                    <video
                                                        ref={el => {
                                                            if (p.isHost) {
                                                                myVideoRef.current = el;
                                                            } else {
                                                                videoRefs.current[p.peerId] = el;
                                                            }
                                                        }}
                                                        autoPlay
                                                        playsInline
                                                        muted={p.isHost}
                                                        className="w-full h-40 bg-gray-900 rounded-lg mb-3 object-cover"
                                                    />
                                                    
                                                    {gdStarted && !p.isHost && (
                                                        <div className="space-y-2">
                                                            <div className={`flex items-center gap-2 ${p.speaking ? 'text-red-600' : 'text-gray-400'}`}>
                                                                <Mic />
                                                                <span className="text-sm font-semibold">
                                                                    {p.speaking ? 'Speaking...' : 'Listening'}
                                                                </span>
                                                            </div>
                                                            <div className="text-xs text-gray-600">
                                                                Time: {formatTime(p.speakingTime)} | Turns: {p.contributions}
                                                            </div>
                                                            <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
                                                                <div 
                                                                    className="h-full bg-blue-500 transition-all"
                                                                    style={{ width: `${Math.min(100, p.audioLevel)}%` }}
                                                                />
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="bg-gradient-to-r from-green-500 to-blue-500 rounded-xl shadow-lg p-6 text-white">
                                    <div className="flex justify-between items-center flex-wrap gap-4">
                                        <div>
                                            <h3 className="text-2xl font-bold mb-2">
                                                {gdStarted ? '🔴 GD in Progress' : '⏸️ Ready to Start'}
                                            </h3>
                                            {gdStarted && (
                                                <div className="text-lg">Duration: {formatTime(totalTime)}</div>
                                            )}
                                        </div>
                                        <div className="flex gap-4">
                                            {!gdStarted ? (
                                                <button
                                                    onClick={startGD}
                                                    disabled={participants.length <= 1}
                                                    className="px-8 py-4 bg-white text-green-600 rounded-xl font-bold text-lg hover:bg-gray-100 disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed transition-all transform hover:scale-105"
                                                >
                                                    🎬 Start GD
                                                </button>
                                            ) : (
                                                <button
                                                    onClick={endGD}
                                                    className="px-8 py-4 bg-red-600 text-white rounded-xl font-bold text-lg hover:bg-red-700 transition-all transform hover:scale-105 flex items-center gap-2"
                                                >
                                                    <StopCircle />
                                                    End GD & Generate Feedback
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}

                        {gdEnded && analysis && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-green-500 to-blue-500 rounded-xl shadow-lg p-6 text-white">
                                    <h2 className="text-3xl font-bold mb-4">📊 Group Discussion Summary</h2>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="bg-white/10 rounded-lg p-4">
                                            <div className="text-sm opacity-90">Duration</div>
                                            <div className="text-3xl font-bold">{formatTime(analysis.groupInsights.totalTime)}</div>
                                        </div>
                                        <div className="bg-white/10 rounded-lg p-4">
                                            <div className="text-sm opacity-90">Total Turns</div>
                                            <div className="text-3xl font-bold">{analysis.groupInsights.totalContributions}</div>
                                        </div>
                                        <div className="bg-white/10 rounded-lg p-4">
                                            <div className="text-sm opacity-90">Avg Score</div>
                                            <div className="text-3xl font-bold">{analysis.groupInsights.avgScore}</div>
                                        </div>
                                        <div className="bg-white/10 rounded-lg p-4">
                                            <div className="text-sm opacity-90">Top Performer</div>
                                            <div className="text-lg font-bold">{analysis.groupInsights.bestPerformer.name}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <h2 className="text-3xl font-bold text-gray-800 mb-6">🎯 Individual Feedback</h2>
                                    <div className="space-y-6">
                                        {analysis.participants.map((p, idx) => (
                                            <div key={idx} className="border-2 border-gray-200 rounded-xl p-6 hover:shadow-lg transition-shadow">
                                                <div className="flex justify-between items-start mb-4">
                                                    <div>
                                                        <h3 className="text-2xl font-bold text-blue-600">{p.name}</h3>
                                                        <div className="text-gray-600">Speaking: {formatTime(p.speakingTime)} ({p.speakingPercentage}%)</div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-5xl font-bold text-purple-600">{p.grade}</div>
                                                        <div className="text-xl font-semibold text-gray-700">{p.overallScore}/100</div>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                                                    <div className="text-center p-3 bg-blue-50 rounded-lg">
                                                        <div className="text-2xl font-bold text-blue-600">{p.participationScore}</div>
                                                        <div className="text-xs text-gray-600">Participation</div>
                                                    </div>
                                                    <div className="text-center p-3 bg-green-50 rounded-lg">
                                                        <div className="text-2xl font-bold text-green-600">{p.engagementScore}</div>
                                                        <div className="text-xs text-gray-600">Engagement</div>
                                                    </div>
                                                    <div className="text-center p-3 bg-purple-50 rounded-lg">
                                                        <div className="text-2xl font-bold text-purple-600">{p.balanceScore}</div>
                                                        <div className="text-xs text-gray-600">Balance</div>
                                                    </div>
                                                    <div className="text-center p-3 bg-yellow-50 rounded-lg">
                                                        <div className="text-2xl font-bold text-yellow-600">{p.sentimentScore}</div>
                                                        <div className="text-xs text-gray-600">Communication</div>
                                                    </div>
                                                </div>

                                                <div className="bg-gradient-to-r from-blue-50 to-purple-50 rounded-lg p-4">
                                                    <h4 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                                                        <Award />
                                                        AI Feedback
                                                    </h4>
                                                    <ul className="space-y-2">
                                                        {p.feedback.map((fb, i) => (
                                                            <li key={i} className="text-gray-700 text-sm">{fb}</li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="text-center">
                                    <button
                                        onClick={() => window.location.reload()}
                                        className="px-8 py-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-bold text-lg hover:from-blue-700 hover:to-purple-700 transition-all transform hover:scale-105"
                                    >
                                        🔄 Start New Session
                                    </button>
                                </div>
                            </div>
                        )}

                        <div className="mt-8 text-center text-sm text-gray-500">
                            <p>✨ Powered by PeerJS WebRTC • No Server Required</p>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<MultiDeviceGDAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
