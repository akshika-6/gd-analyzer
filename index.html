<!-- <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Device GD Analyzer</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Icons
        const Brain = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
                <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
            </svg>
        );

        const Users = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
        );

        const Video = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m22 8-6 4 6 4V8Z"/>
                <rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>
            </svg>
        );

        const Mic = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
        );

        const StopCircle = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <rect width="6" height="6" x="9" y="9"/>
            </svg>
        );

        const Copy = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
            </svg>
        );

        const Check = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        );

        const Award = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="8" r="6"/>
                <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
            </svg>
        );

        const AlertCircle = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" x2="12" y1="8" y2="12"/>
                <line x1="12" x2="12.01" y1="16" y2="16"/>
            </svg>
        );

        const MultiDeviceGDAnalyzer = () => {
            const [mode, setMode] = useState(null);
            const [roomCode, setRoomCode] = useState('');
            const [participantName, setParticipantName] = useState('');
            const [joinCode, setJoinCode] = useState('');
            const [copied, setCopied] = useState(false);
            const [participants, setParticipants] = useState([]);
            const [gdStarted, setGdStarted] = useState(false);
            const [gdEnded, setGdEnded] = useState(false);
            const [totalTime, setTotalTime] = useState(0);
            const [analysis, setAnalysis] = useState(null);
            const [connected, setConnected] = useState(false);
            const [myStream, setMyStream] = useState(null);
            const [connectionStatus, setConnectionStatus] = useState('');
            
            const peerRef = useRef(null);
            const connectionsRef = useRef({});
            const videoRefs = useRef({});
            const audioContexts = useRef({});
            const analyzerNodes = useRef({});
            const startTimeRef = useRef(null);
            const myVideoRef = useRef(null);
            const myPeerIdRef = useRef(null);

            // Host: Create room
            const startAsHost = async () => {
                const hostName = prompt("Enter your name (Host):");
                if (!hostName || !hostName.trim()) return;

                setConnectionStatus('Creating room...');
                setParticipantName(hostName);
                setMode('host');
                
                try {
                    // Get host's camera first
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    setMyStream(stream);
                    
                    // Generate custom peer ID for faster initialization
                    const customPeerId = 'host-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                    
                    const peer = new Peer(customPeerId, {
                        config: {
                            iceServers: [
                                { urls: 'stun:stun.l.google.com:19302' },
                                { urls: 'stun:stun1.l.google.com:19302' }
                            ]
                        },
                        debug: 1
                    });
                    peerRef.current = peer;

                    peer.on('open', (id) => {
                        myPeerIdRef.current = id;
                        setRoomCode(id);
                        setConnectionStatus('Room created! Share the Peer ID.');
                        
                        // Add host as first participant
                        setParticipants([{
                            id: 'host',
                            peerId: id,
                            name: hostName,
                            stream: stream,
                            speaking: false,
                            speakingTime: 0,
                            contributions: 0,
                            sentimentScore: 0,
                            audioLevel: 0,
                            isHost: true
                        }]);
                    });
                    
                    // Fallback timeout if peer initialization takes too long
                    const timeoutId = setTimeout(() => {
                        if (myPeerIdRef.current === null) {
                            console.warn('Peer initialization timeout, using custom ID');
                            myPeerIdRef.current = customPeerId;
                            setRoomCode(customPeerId);
                            setConnectionStatus('Room created! Share the Peer ID.');
                        }
                    }, 5000);
                    
                    peer.on('open', () => clearTimeout(timeoutId));
                    
                } catch (err) {
                    alert('Error accessing camera/microphone: ' + err.message);
                    setMode(null);
                    setConnectionStatus('');
                    return;
                }

                peer.on('connection', (conn) => {
                    console.log('New connection from:', conn.peer);
                    connectionsRef.current[conn.peer] = conn;

                    conn.on('data', (data) => {
                        handleDataFromParticipant(data, conn.peer);
                    });

                    conn.on('open', () => {
                        console.log('Connection opened with:', conn.peer);
                    });
                });

                peer.on('call', (call) => {
                    console.log('Receiving call from:', call.peer);
                    
                    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                        .then(stream => {
                            if (!myStream) {
                                setMyStream(stream);
                                if (myVideoRef.current) {
                                    myVideoRef.current.srcObject = stream;
                                }
                            }
                            
                            call.answer(stream);
                            
                            call.on('stream', (remoteStream) => {
                                console.log('Received stream from:', call.peer);
                                setParticipants(prev => prev.map(p => 
                                    p.peerId === call.peer ? { ...p, stream: remoteStream } : p
                                ));
                                
                                if (videoRefs.current[call.peer]) {
                                    videoRefs.current[call.peer].srcObject = remoteStream;
                                }
                                
                                setupAudioAnalysis(call.peer, remoteStream);
                            });
                        })
                        .catch(err => console.error('Error accessing media:', err));
                });

                peer.on('error', (err) => {
                    console.error('Peer error:', err);
                    setConnectionStatus('Error: ' + err.type);
                });
            };

            // Participant: Join room
            const joinAsParticipant = async () => {
                if (!participantName.trim() || !joinCode.trim()) {
                    alert('Please enter your name and room code');
                    return;
                }

                setConnectionStatus('Connecting...');
                
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    setMyStream(stream);
                    
                    if (myVideoRef.current) {
                        myVideoRef.current.srcObject = stream;
                    }

                    // Generate custom participant ID for faster initialization
                    const customPeerId = 'participant-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                    
                    const peer = new Peer(customPeerId, {
                        config: {
                            iceServers: [
                                { urls: 'stun:stun.l.google.com:19302' },
                                { urls: 'stun:stun1.l.google.com:19302' }
                            ]
                        },
                        debug: 1
                    });
                    peerRef.current = peer;

                    let connected = false;
                    let connectionAttempt = 0;
                    const maxAttempts = 3;

                    peer.on('open', (myId) => {
                        myPeerIdRef.current = myId;
                        console.log('My peer ID:', myId);
                        
                        if (connected) return;
                        
                        // Directly connect to the host using the provided room code
                        const hostId = joinCode;
                        
                        try {
                            const conn = peer.connect(hostId);
                            connectionsRef.current['host'] = conn;

                            conn.on('open', () => {
                                connected = true;
                                console.log('Connected to host');
                                setConnectionStatus('Connected to host!');
                                setMode('participant');
                                setRoomCode(joinCode);
                                setConnected(true);
                                
                                // Send join request
                                conn.send({
                                    type: 'join',
                                    name: participantName,
                                    peerId: myId
                                });
                                
                                // Call host with video/audio
                                const call = peer.call(hostId, stream);
                                
                                call.on('stream', (hostStream) => {
                                    console.log('Received host stream');
                                });
                            });

                            conn.on('data', (data) => {
                                handleDataFromHost(data);
                            });

                            conn.on('error', (err) => {
                                console.error('Connection error:', err);
                                if (!connected && connectionAttempt < maxAttempts) {
                                    connectionAttempt++;
                                    console.log('Retrying connection attempt', connectionAttempt);
                                }
                            });
                        } catch (err) {
                            console.log('Failed to connect to:', hostId, err);
                            if (!connected) {
                                setConnectionStatus('Could not find host. Please check the room code.');
                            }
                        }
                    });

                    // Timeout for connection attempts
                    setTimeout(() => {
                        if (!connected) {
                            setConnectionStatus('Could not connect to host. Please verify the Peer ID and try again.');
                        }
                    }, 10000);

                    peer.on('error', (err) => {
                        console.error('Peer error:', err);
                        setConnectionStatus('Error connecting: ' + err.type);
                    });

                } catch (err) {
                    alert('Error accessing camera/microphone: ' + err.message);
                    setConnectionStatus('');
                }
            };

            // Generate possible host peer IDs from room code
            const generatePossibleHostIds = (code) => {
                // Room code IS the host's peer ID directly
                return [code.toLowerCase().trim()];
            };

            // Handle data from participant (HOST receives)
            const handleDataFromParticipant = (data, peerId) => {
                console.log('Received data:', data);
                
                if (data.type === 'join') {
                    // Add new participant
                    setParticipants(prev => {
                        if (prev.some(p => p.peerId === peerId)) return prev;
                        return [...prev, {
                            id: peerId,
                            peerId: peerId,
                            name: data.name,
                            stream: null,
                            speaking: false,
                            speakingTime: 0,
                            contributions: 0,
                            sentimentScore: 0,
                            audioLevel: 0,
                            isHost: false
                        }];
                    });
                    
                    // Broadcast updated participant list
                    broadcastToAll({
                        type: 'participant-list',
                        participants: participants.map(p => ({
                            name: p.name,
                            peerId: p.peerId,
                            isHost: p.isHost
                        }))
                    });
                } else if (data.type === 'audio-level') {
                    updateParticipantAudio(peerId, data.level);
                }
            };

            // Handle data from host (PARTICIPANT receives)
            const handleDataFromHost = (data) => {
                console.log('Received from host:', data);
                
                if (data.type === 'gd-start') {
                    setGdStarted(true);
                } else if (data.type === 'gd-end') {
                    alert('GD has ended! Check host screen for feedback.');
                } else if (data.type === 'participant-list') {
                    // Update participant list for display
                    console.log('Participant list:', data.participants);
                }
            };

            // Broadcast to all connected participants
            const broadcastToAll = (data) => {
                Object.values(connectionsRef.current).forEach(conn => {
                    if (conn.open) {
                        conn.send(data);
                    }
                });
            };

            // Setup audio analysis
            const setupAudioAnalysis = (peerId, stream) => {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const audioSource = audioContext.createMediaStreamSource(stream);
                    const analyzer = audioContext.createAnalyser();
                    analyzer.fftSize = 256;
                    audioSource.connect(analyzer);
                    
                    audioContexts.current[peerId] = audioContext;
                    analyzerNodes.current[peerId] = analyzer;
                    
                    const monitorAudio = () => {
                        if (!gdStarted || gdEnded) return;
                        
                        const dataArray = new Uint8Array(analyzer.frequencyBinCount);
                        analyzer.getByteFrequencyData(dataArray);
                        const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                        
                        const isSpeaking = average > 30;
                        
                        setParticipants(prev => prev.map(p => {
                            if (p.peerId === peerId) {
                                const wasNotSpeaking = !p.speaking;
                                const nowSpeaking = isSpeaking;
                                const newContributions = wasNotSpeaking && nowSpeaking ? p.contributions + 1 : p.contributions;
                                const newSentiment = nowSpeaking && wasNotSpeaking 
                                    ? p.sentimentScore + (Math.random() * 2 - 0.5) 
                                    : p.sentimentScore;
                                
                                return {
                                    ...p,
                                    speaking: isSpeaking,
                                    contributions: newContributions,
                                    sentimentScore: newSentiment,
                                    audioLevel: average
                                };
                            }
                            return p;
                        }));
                        
                        if (gdStarted && !gdEnded) {
                            requestAnimationFrame(monitorAudio);
                        }
                    };
                    
                    if (gdStarted) monitorAudio();
                } catch (err) {
                    console.error('Audio analysis error:', err);
                }
            };

            const updateParticipantAudio = (peerId, level) => {
                setParticipants(prev => prev.map(p => 
                    p.peerId === peerId ? { ...p, audioLevel: level } : p
                ));
            };

            const startGD = () => {
                if (participants.length <= 1) {
                    alert('Need at least 2 participants (including host)!');
                    return;
                }
                
                setGdStarted(true);
                startTimeRef.current = Date.now();
                
                broadcastToAll({ type: 'gd-start' });
                
                // Start audio monitoring for all participants including host
                participants.forEach(p => {
                    if (p.stream && audioAnalyzerNodes.current[p.peerId]) {
                        // Audio monitoring will start automatically
                    }
                });
            };

            const endGD = () => {
                setGdEnded(true);
                setGdStarted(false);
                
                broadcastToAll({ type: 'gd-end' });
                
                Object.values(audioContexts.current).forEach(ctx => ctx.close());
                
                runMLAnalysis();
            };

            const runMLAnalysis = () => {
                const results = participants.filter(p => !p.isHost).map(participant => {
                    const speakingPercentage = totalTime > 0 ? (participant.speakingTime / totalTime) * 100 : 0;
                    const contributionsPerMinute = totalTime > 0 ? (participant.contributions / (totalTime / 60)) : 0;
                    
                    const participationScore = Math.min(100, speakingPercentage * 2);
                    const engagementScore = Math.min(100, contributionsPerMinute * 20);
                    const balanceScore = Math.min(100, 100 - Math.abs(speakingPercentage - (100 / participants.length)) * 2);
                    const sentimentScore = Math.min(100, Math.max(0, 50 + participant.sentimentScore * 10));
                    
                    const overallScore = (
                        participationScore * 0.35 + 
                        engagementScore * 0.25 + 
                        balanceScore * 0.20 + 
                        sentimentScore * 0.20
                    ).toFixed(1);
                    
                    let feedback = [];
                    
                    if (participationScore < 40) {
                        feedback.push('🔴 Low participation - try to speak more and share your ideas');
                    } else if (participationScore > 70) {
                        feedback.push('🟢 Excellent participation - you actively engaged in the discussion');
                    } else {
                        feedback.push('🟡 Good participation - maintain this level of engagement');
                    }
                    
                    if (engagementScore < 30) {
                        feedback.push('💡 Make more contributions - break down your points into smaller segments');
                    } else if (engagementScore > 60) {
                        feedback.push('⭐ Great engagement - you contributed frequently to the discussion');
                    }
                    
                    if (balanceScore < 40) {
                        if (speakingPercentage > (100 / participants.length)) {
                            feedback.push('⚖️ Allow others more speaking time - practice active listening');
                        } else {
                            feedback.push('⚖️ Speak up more - your voice is valuable to the discussion');
                        }
                    } else {
                        feedback.push('✅ Well-balanced participation - great teamwork');
                    }
                    
                    if (sentimentScore > 60) {
                        feedback.push('😊 Positive communication style - maintained constructive tone');
                    } else if (sentimentScore < 40) {
                        feedback.push('💭 Work on maintaining positive and constructive communication');
                    }
                    
                    let grade;
                    if (overallScore >= 85) grade = 'A+';
                    else if (overallScore >= 75) grade = 'A';
                    else if (overallScore >= 65) grade = 'B+';
                    else if (overallScore >= 55) grade = 'B';
                    else if (overallScore >= 45) grade = 'C';
                    else grade = 'D';
                    
                    return {
                        name: participant.name,
                        speakingTime: participant.speakingTime,
                        speakingPercentage: speakingPercentage.toFixed(1),
                        contributions: participant.contributions,
                        contributionsPerMinute: contributionsPerMinute.toFixed(1),
                        overallScore,
                        participationScore: participationScore.toFixed(1),
                        engagementScore: engagementScore.toFixed(1),
                        balanceScore: balanceScore.toFixed(1),
                        sentimentScore: sentimentScore.toFixed(1),
                        feedback,
                        grade
                    };
                });
                
                const avgScore = results.reduce((sum, r) => sum + parseFloat(r.overallScore), 0) / results.length || 0;
                
                setAnalysis({
                    participants: results,
                    groupInsights: {
                        totalTime,
                        avgScore: avgScore.toFixed(1),
                        totalContributions: results.reduce((sum, r) => sum + r.contributions, 0),
                        bestPerformer: results.length > 0 ? results.reduce((max, r) => 
                            parseFloat(r.overallScore) > parseFloat(max.overallScore) ? r : max
                        ) : { name: 'N/A' },
                        needsImprovement: results.length > 0 ? results.reduce((min, r) => 
                            parseFloat(r.overallScore) < parseFloat(min.overallScore) ? r : min
                        ) : { name: 'N/A' }
                    }
                });
            };

            const copyRoomCode = () => {
                const fullCode = myPeerIdRef.current || roomCode;
                navigator.clipboard.writeText(fullCode);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            useEffect(() => {
                let interval;
                if (gdStarted && !gdEnded) {
                    interval = setInterval(() => {
                        setTotalTime(Math.floor((Date.now() - startTimeRef.current) / 1000));
                        
                        setParticipants(prev => prev.map(p => {
                            if (p.speaking) {
                                return { ...p, speakingTime: p.speakingTime + 1 };
                            }
                            return p;
                        }));
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [gdStarted, gdEnded]);

            useEffect(() => {
                return () => {
                    if (peerRef.current) {
                        peerRef.current.destroy();
                    }
                };
            }, []);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            if (!mode) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50 flex items-center justify-center p-4">
                        <div className="max-w-4xl w-full">
                            <div className="text-center mb-12">
                                <div className="flex items-center justify-center mb-4">
                                    <div className="w-16 h-16 text-blue-600">
                                        <Brain />
                                    </div>
                                </div>
                                <h1 className="text-5xl font-bold text-gray-800 mb-2">Multi-Device GD Analyzer</h1>
                                <p className="text-gray-600 text-lg">Real-time Video • Multi-Device Support • AI Feedback</p>
                                {connectionStatus && (
                                    <p className="mt-4 text-sm text-blue-600 font-semibold">{connectionStatus}</p>
                                )}
                            </div>

                            <div className="grid md:grid-cols-2 gap-6">
                                <div className="bg-white rounded-2xl shadow-xl p-8 hover:shadow-2xl transition-shadow border-2 border-blue-200">
                                    <div className="text-center">
                                        <div className="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <Users />
                                        </div>
                                        <h2 className="text-2xl font-bold text-gray-800 mb-2">Host GD Session</h2>
                                        <p className="text-gray-600 mb-6">Create a room and invite participants</p>
                                        <button
                                            onClick={startAsHost}
                                            className="w-full px-6 py-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-bold text-lg hover:from-blue-700 hover:to-purple-700 transition-all transform hover:scale-105"
                                        >
                                            🎯 Create Room
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-xl p-8 hover:shadow-2xl transition-shadow border-2 border-green-200">
                                    <div className="text-center">
                                        <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <Video />
                                        </div>
                                        <h2 className="text-2xl font-bold text-gray-800 mb-2">Join as Participant</h2>
                                        <p className="text-gray-600 mb-4">Enter room code to join</p>
                                        <input
                                            type="text"
                                            placeholder="Your Name"
                                            value={participantName}
                                            onChange={(e) => setParticipantName(e.target.value)}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-green-500 focus:border-transparent"
                                        />
                                        <input
                                            type="text"
                                            placeholder="Full Peer ID from Host"
                                            value={joinCode}
                                            onChange={(e) => setJoinCode(e.target.value.toLowerCase())}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-green-500 focus:border-transparent"
                                        />
                                        <button
                                            onClick={joinAsParticipant}
                                            className="w-full px-6 py-4 bg-gradient-to-r from-green-600 to-blue-600 text-white rounded-xl font-bold text-lg hover:from-green-700 hover:to-blue-700 transition-all transform hover:scale-105"
                                        >
                                            🚀 Join Room
                                        </button>
                                    </div>

        const MultiDeviceGDAnalyzer = () => {

            const [joinCode, setJoinCode] = useState('');

            const [gdEnded, setGdEnded] = useState(false);
            const [totalTime, setTotalTime] = useState(0);
            const [analysis, setAnalysis] = useState(null);
